<!doctype html>
<html lang="no">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>tresfjording.no</title>
    <style>
      :root {
        --bg: #f3ebdf;
        --panel: #fffaf5;
        --ink: #1d1a18;
        --muted: #625950;
        --accent: #8d3f25;
        --accent-strong: #6f301d;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #efe2d3 0%, var(--bg) 100%);
        color: var(--ink);
        font: 18px Georgia, serif;
      }

      main {
        width: min(90vw, 760px);
        background: var(--panel);
        border: 1px solid rgba(29, 26, 24, 0.1);
        border-radius: 16px;
        box-shadow: 0 16px 48px rgba(29, 26, 24, 0.08);
        padding: 2.5rem 2rem;
      }

      h1 {
        margin: 0 0 0.25rem;
        font-size: clamp(2.2rem, 5vw, 4rem);
        line-height: 1.1;
      }

      p {
        margin: 0 0 1.5rem;
        color: var(--muted);
      }

      .menu {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 0.9rem;
      }

      .menu a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 54px;
        padding: 0.8rem 1rem;
        border-radius: 12px;
        border: 1px solid rgba(141, 63, 37, 0.25);
        background: #fff;
        color: var(--accent-strong);
        text-decoration: none;
        font-weight: 600;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .menu a:hover,
      .menu a:focus-visible {
        transform: translateY(-1px);
        box-shadow: 0 8px 18px rgba(141, 63, 37, 0.12);
      }

      .note {
        margin-top: 1.5rem;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>tresfjording.no</h1>
      <p>Velg siden du vil åpne.</p>

      <nav class="menu" aria-label="Hovedmeny">

      <p class="note">Rediger disse lenkene i denne filen når du vil endre menyen.</p>
    </main>
  </body>
</html>
