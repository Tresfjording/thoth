<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>THOTH | Logg inn</title>
    <style>
        :root {
            --bg: #f6efe8;
            --panel: #fffaf3;
            --ink: #1f1a17;
            --muted: #6a5c52;
            --accent: #7b3d2b;
            --border: #d7c9bc;
            --error: #8f2a2a;
            --success: #285d3d;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: var(--bg);
            color: var(--ink);
            font-family: Arial, sans-serif;
        }
        .auth-shell {
            width: min(92vw, 480px);
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px 24px;
            box-shadow: 0 18px 40px rgba(43, 29, 18, 0.08);
        }
        h1 {
            margin: 0 0 8px;
            font-size: clamp(1.8rem, 5vw, 2.4rem);
        }
        .subtitle {
            margin: 0 0 18px;
            color: var(--muted);
            line-height: 1.6;
        }
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
        }
        .tab-button {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid var(--border);
            background: #f1e8df;
            color: var(--ink);
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
        }
        .tab-button.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }
        .panel {
            display: none;
        }
        .panel.active {
            display: block;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            margin-bottom: 14px;
            font-size: 1rem;
        }
        button {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 12px 16px;
            cursor: pointer;
            background: var(--accent);
            color: white;
            font-weight: 700;
            font-size: 1rem;
        }
        .error-list, .success-message {
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 14px;
            font-size: 0.95rem;
        }
        .error-list {
            background: rgba(143, 42, 42, 0.08);
            color: var(--error);
        }
        .success-message {
            background: rgba(40, 93, 61, 0.08);
            color: var(--success);
        }
    </style>
</head>
<body>
    <main class="auth-shell">
        <h1>THOTH</h1>
        <p class="subtitle">Logg inn for å redigere manuskriptet. Registrer deg om du er ny bruker.</p>

        <div class="tabs" aria-label="Autentisering">
            <button type="button" class="tab-button active" data-mode="login">Logg inn</button>
            <button type="button" class="tab-button " data-mode="register">Registrer</button>
        </div>

        
                    <div class="success-message">Brukeren ble opprettet. Du kan nå logge inn.</div>
        
        <section class="panel active" data-panel="login">
            <form method="post" action="login.php">
                <input type="hidden" name="mode" value="login">
                <label for="login-username">Brukernavn</label>
                <input id="login-username" name="username" type="text" autocomplete="username" required>

                <label for="login-password">Passord</label>
                <input id="login-password" name="password" type="password" autocomplete="current-password" required>

                <button type="submit">Logg inn</button>
            </form>
        </section>

        <section class="panel " data-panel="register">
            <form method="post" action="login.php">
                <input type="hidden" name="mode" value="register">
                <label for="register-username">Brukernavn</label>
                <input id="register-username" name="username" type="text" autocomplete="username" required>

                <label for="register-password">Passord</label>
                <input id="register-password" name="password" type="password" autocomplete="new-password" required>

                <label for="register-first-name">Fornavn</label>
                <input id="register-first-name" name="first_name" type="text" required>

                <label for="register-last-name">Etternavn</label>
                <input id="register-last-name" name="last_name" type="text" required>

                <label for="register-email">E-post</label>
                <input id="register-email" name="email" type="email" autocomplete="email" required>

                <label for="register-phone">Telefon (valgfritt)</label>
                <input id="register-phone" name="phone" type="text" autocomplete="tel">

                <button type="submit">Registrer bruker</button>
            </form>
        </section>
    </main>

    <script>
        const buttons = document.querySelectorAll('.tab-button');
        const panels = document.querySelectorAll('.panel');

        buttons.forEach((button) => {
            button.addEventListener('click', () => {
                const mode = button.dataset.mode;
                buttons.forEach((btn) => btn.classList.toggle('active', btn === button));
                panels.forEach((panel) => panel.classList.toggle('active', panel.dataset.panel === mode));
            });
        });
    </script>
</body>
</html>
